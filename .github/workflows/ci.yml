name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: appointment_assistant_test
          POSTGRES_USER: appointment_assistant
          POSTGRES_PASSWORD: appointment_assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appointment_assistant -d appointment_assistant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8.8.3-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: testing

      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: appointment_assistant_test
      DB_USERNAME: appointment_assistant
      DB_PASSWORD: appointment_assistant

      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PASSWORD: null

      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, redis
          tools: composer:v2
          coverage: none

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env.testing
          php artisan key:generate --env=testing

      - name: Run backend tests
        run: composer test

  public-web:
    name: Public Web
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: public-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          working-directory: public-web
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Lint public web
        run: pnpm lint

      - name: Build public web
        run: pnpm build
