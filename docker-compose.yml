services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: appointment_assistant
      POSTGRES_USER: appointment_assistant
      POSTGRES_PASSWORD: appointment_assistant
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U appointment_assistant -d appointment_assistant",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.8.3-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
